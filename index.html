<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buzón de ideas — Cena de fin de año</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Sistema de diseño (CLAUDE.md §7): rojo, negro y blanco. Tipografía Roboto. */
  :root {
    color-scheme: light dark;
    --rojo: #d62828;
    --rojo-oscuro: #a51f1f;
    --negro: #111111;
    --blanco: #ffffff;
    --fondo: #f2f2f2;
    --borde: #d9d9d9;
    --tenue: #5c5c5c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --negro: #f2f2f2;
      --blanco: #1a1a1a;
      --fondo: #000000;
      --borde: #3a3a3a;
      --tenue: #a8a8a8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Roboto", Arial, Helvetica, sans-serif;
    background: var(--fondo); color: var(--negro);
    padding: 24px;
    display: flex; justify-content: center;
  }
  .contenedor { width: 100%; max-width: 560px; }
  .tarjeta {
    background: var(--blanco); border: 1px solid var(--borde); border-radius: 14px;
    padding: 28px 24px; margin-bottom: 18px;
    border-top: 4px solid var(--rojo);
    box-shadow: 0 10px 30px -18px rgba(0,0,0,.35);
  }
  h1 { font-size: 24px; font-weight: 700; margin: 0 0 10px; line-height: 1.25; }
  .explicacion { margin: 0; line-height: 1.55; color: var(--tenue); }

  .pestanas {
    display: flex; gap: 4px; background: var(--blanco); border: 1px solid var(--borde);
    border-radius: 12px; padding: 4px; margin-bottom: 18px;
  }
  .pestana {
    flex: 1; padding: 10px; text-align: center; border: 0; border-radius: 9px;
    background: transparent; font-family: inherit; font-size: 15px; font-weight: 500;
    cursor: pointer; color: var(--negro);
  }
  .pestana.activa { background: var(--rojo); color: #ffffff; }

  .vista { display: none; }
  .vista.activa { display: block; }

  .propuesta {
    background: var(--blanco); border: 1px solid var(--borde); border-radius: 14px;
    padding: 18px 20px; margin-bottom: 12px;
  }
  .propuesta .lugar { font-size: 17px; font-weight: 700; margin: 0 0 4px; }
  .propuesta .quien { font-size: 13px; color: var(--tenue); margin: 0 0 8px; }
  .propuesta .justificacion { margin: 0 0 14px; line-height: 1.5; }
  .fila-voto { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .votos { font-size: 14px; font-weight: 500; color: var(--tenue); }
  button.votar {
    border: 1px solid var(--rojo); background: transparent; color: var(--rojo);
    border-radius: 9px; padding: 8px 16px; font-family: inherit; font-size: 14px;
    font-weight: 500; cursor: pointer;
  }
  button.votar:hover:not(:disabled) { background: var(--rojo); color: #ffffff; }
  button.votar:disabled { border-color: var(--borde); color: var(--tenue); cursor: default; }

  .vacio { text-align: center; color: var(--tenue); padding: 20px 0; }

  form { display: flex; flex-direction: column; gap: 14px; }
  label { font-size: 14px; font-weight: 500; display: block; margin-bottom: 6px; }
  input, textarea {
    width: 100%; border: 1px solid var(--borde); border-radius: 9px;
    padding: 10px 12px; font-size: 15px; font-family: inherit;
    background: var(--blanco); color: var(--negro);
  }
  input:focus, textarea:focus { outline: 2px solid var(--rojo); outline-offset: 1px; }
  textarea { resize: vertical; min-height: 70px; }
  button.enviar {
    border: 0; background: var(--rojo); color: #ffffff; border-radius: 9px;
    padding: 12px; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer;
  }
  button.enviar:hover:not(:disabled) { background: var(--rojo-oscuro); }
  button.enviar:disabled { background: var(--tenue); cursor: default; }
  .aviso { font-size: 13px; margin: 0; font-weight: 500; }
  .aviso.error { color: var(--rojo); }
  .aviso.ok { color: var(--negro); }
</style>
</head>
<body>
  <div class="contenedor">
    <div class="tarjeta">
      <h1>Buzón de ideas para la cena de fin de año</h1>
      <p class="explicacion">
        Comparte aquí tu idea para la cena de fin de año: lugar, comida,
        actividad o lo que se te ocurra. Todas las ideas se juntan en un
        solo lugar para decidir entre todos.
      </p>
    </div>

    <div class="pestanas">
      <button type="button" class="pestana activa" data-vista="lista">Propuestas</button>
      <button type="button" class="pestana" data-vista="nueva">Proponer un lugar</button>
    </div>

    <div id="vista-lista" class="vista activa">
      <div id="lista-propuestas"><p class="vacio">Cargando propuestas…</p></div>
    </div>

    <div id="vista-nueva" class="vista">
      <div class="tarjeta">
        <form id="form-propuesta">
          <div>
            <label for="lugar">Lugar</label>
            <input id="lugar" name="lugar" type="text" maxlength="120" required>
          </div>
          <div>
            <label for="propuesto_por">Tu nombre</label>
            <input id="propuesto_por" name="propuesto_por" type="text" maxlength="80" required>
          </div>
          <div>
            <label for="justificacion">Breve justificación</label>
            <textarea id="justificacion" name="justificacion" maxlength="400"></textarea>
          </div>
          <button type="submit" class="enviar">Enviar propuesta</button>
          <p id="aviso-form" class="aviso"></p>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = "https://rzzuxmtglmshsfjgrjko.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3F11sg3sXv56XRlDwDggNg_JQZ7Ab6l";
    const cliente = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    function idVotante() {
      let id = localStorage.getItem("votante_id");
      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem("votante_id", id);
      }
      return id;
    }

    function misVotos() {
      try {
        return JSON.parse(localStorage.getItem("mis_votos") || "[]");
      } catch {
        return [];
      }
    }

    function marcarVotado(propuestaId) {
      const votos = misVotos();
      votos.push(propuestaId);
      localStorage.setItem("mis_votos", JSON.stringify(votos));
    }

    function escapar(texto) {
      const div = document.createElement("div");
      div.textContent = texto;
      return div.innerHTML;
    }

    // Pestañas
    document.querySelectorAll(".pestana").forEach((boton) => {
      boton.addEventListener("click", () => {
        document.querySelectorAll(".pestana").forEach((b) => b.classList.remove("activa"));
        document.querySelectorAll(".vista").forEach((v) => v.classList.remove("activa"));
        boton.classList.add("activa");
        document.getElementById("vista-" + boton.dataset.vista).classList.add("activa");
      });
    });

    async function cargarPropuestas() {
      const contenedor = document.getElementById("lista-propuestas");
      const { data, error } = await cliente
        .from("propuestas_cena")
        .select("id, lugar, propuesto_por, justificacion, creado_en, propuestas_cena_votos(count)")
        .order("creado_en", { ascending: false });

      if (error) {
        contenedor.innerHTML = '<p class="vacio">No se pudieron cargar las propuestas.</p>';
        return;
      }

      if (!data || data.length === 0) {
        contenedor.innerHTML = '<p class="vacio">Todavía no hay ninguna propuesta. ¡Sé el primero!</p>';
        return;
      }

      const votados = misVotos();

      contenedor.innerHTML = data.map((p) => {
        const votos = p.propuestas_cena_votos?.[0]?.count ?? 0;
        const yaVoto = votados.includes(p.id);
        return `
          <div class="propuesta">
            <p class="lugar">${escapar(p.lugar)}</p>
            <p class="quien">Propuesto por ${escapar(p.propuesto_por)}</p>
            ${p.justificacion ? `<p class="justificacion">${escapar(p.justificacion)}</p>` : ""}
            <div class="fila-voto">
              <span class="votos">${votos} ${votos === 1 ? "voto" : "votos"}</span>
              <button type="button" class="votar" data-id="${p.id}" ${yaVoto ? "disabled" : ""}>
                ${yaVoto ? "Ya votaste" : "Votar"}
              </button>
            </div>
          </div>
        `;
      }).join("");

      contenedor.querySelectorAll("button.votar").forEach((boton) => {
        boton.addEventListener("click", async () => {
          const propuestaId = Number(boton.dataset.id);
          boton.disabled = true;
          const { error } = await cliente
            .from("propuestas_cena_votos")
            .insert({ propuesta_id: propuestaId, votante_id: idVotante() });
          if (!error) {
            marcarVotado(propuestaId);
          }
          cargarPropuestas();
        });
      });
    }

    document.getElementById("form-propuesta").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const boton = evento.target.querySelector("button.enviar");
      const aviso = document.getElementById("aviso-form");
      const lugar = document.getElementById("lugar").value.trim();
      const propuesto_por = document.getElementById("propuesto_por").value.trim();
      const justificacion = document.getElementById("justificacion").value.trim();

      if (!lugar || !propuesto_por) return;

      boton.disabled = true;
      aviso.textContent = "";
      aviso.className = "aviso";

      const { error } = await cliente
        .from("propuestas_cena")
        .insert({ lugar, propuesto_por, justificacion });

      boton.disabled = false;

      if (error) {
        aviso.textContent = "No se pudo enviar la propuesta. Intenta de nuevo.";
        aviso.classList.add("error");
        return;
      }

      aviso.textContent = "¡Propuesta enviada!";
      aviso.classList.add("ok");
      evento.target.reset();
      cargarPropuestas();

      document.querySelector('.pestana[data-vista="lista"]').click();
    });

    cargarPropuestas();
  </script>
</body>
</html>
